<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:description" content="날짜와 시간을 골라 바로 예약하세요. 30분 단위, 최소 2시간부터 이용할 수 있어요.">

<title>화실 쉐어 예약</title>
<script>
/* 저장된 화면 모드를 첫 화면이 그려지기 전에 적용 */
try{var __t=localStorage.getItem('hwasil.theme');if(__t==='light'||__t==='dark')document.documentElement.setAttribute('data-theme',__t);}catch(e){}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 한 장의 카드를 세 칸으로 나눈 구성: 안내 | 달력 | 시간 목록. 좁은 화면에서는 위에서 아래로 쌓이고, 예약 폼은 아래에서 올라오는 시트로 열려요. */
:root{
  --bg:#EDF0F4; --card:#FFFFFF; --ink:#19202C; --muted:#667085; --faint:#B4BBC7; --line:#E3E7ED;
  --accent:#2A44C4; --on-accent:#FFFFFF; --tint:#E8ECFA; --sun:#C0394B; --warn:#F6EFDC;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 14px 44px rgba(16,24,40,.09);
  --f-display:'Gowun Batang','Nanum Myeongjo',serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --card:#171B22; --ink:#E8EBF1; --muted:#9AA3B2; --faint:#505968; --line:#2A303A;
    --accent:#8DA1FF; --on-accent:#0D1122; --tint:#232B49; --sun:#F08C99; --warn:#3A3321;
    --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 44px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --card:#171B22; --ink:#E8EBF1; --muted:#9AA3B2; --faint:#505968; --line:#2A303A;
  --accent:#8DA1FF; --on-accent:#0D1122; --tint:#232B49; --sun:#F08C99; --warn:#3A3321;
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 44px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);margin:0}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.topbar{display:flex;justify-content:flex-end;margin-bottom:12px}
.theme{display:inline-flex;padding:3px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.theme button{border:0;background:transparent;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;min-height:32px}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.notice{background:var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:250px minmax(0,1fr) 280px}
.card>section{padding:28px;min-width:0}
.info{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.timecol{border-left:1px solid var(--line)}
@media (max-width:980px){
  .card{grid-template-columns:minmax(0,1fr) 280px}
  .info{grid-column:1/-1;border-right:0;border-bottom:1px solid var(--line)}
  .timecol{border-left:1px solid var(--line)}
}
@media (max-width:680px){
  .card{grid-template-columns:minmax(0,1fr);border-radius:14px}
  .card>section{padding:20px 16px}
  .timecol{border-left:0;border-top:1px solid var(--line)}
}

.brand{font:700 22px/1.2 var(--f-display);color:var(--accent)}
.info h1{font:500 15px var(--f-body);margin:0;color:var(--muted)}
.meta{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px}
.meta li{display:flex;gap:10px;align-items:flex-start}
.meta svg{flex:none;width:18px;height:18px;margin-top:2px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg{white-space:pre-line;color:var(--muted);font-size:14px;margin:0}
.privacy{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:0}
.admin-box{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
@media (max-width:980px){.admin-box{margin-top:0}}

.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--sun);border-color:var(--sun)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{font-size:12px;font-weight:500;letter-spacing:.04em;padding:4px 10px;border:1px solid var(--accent);color:var(--accent);border-radius:99px}
.login{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.login .inp{width:170px;min-height:36px;font-size:14px;padding:6px 10px}

.q{font:700 20px/1.3 var(--f-display);margin:0 0 14px;text-wrap:balance}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.monthbar .ttl{font-weight:700;font-size:15px}
.monthbar .nav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px}
.dow{font-size:12px;font-weight:500;color:var(--muted);text-align:center;padding:8px 0}
.dow:first-child{color:var(--sun)}
.d{border:0;background:transparent;padding:2px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;min-width:0}
.d.blank{visibility:hidden;cursor:default}
.d .c{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:500 15px var(--f-mono);color:var(--ink)}
.d.avail .c{background:var(--tint)}
.d.today:not(.sel) .c{box-shadow:inset 0 0 0 1.5px var(--accent)}
.d.sun:not(.sel) .c{color:var(--sun)}
.d.past .c{color:var(--faint);background:transparent;box-shadow:none}
.d.closed .c,.d.full .c{color:var(--faint);background:transparent;text-decoration:line-through;box-shadow:none}
.d.past,.d.closed,.d.full{cursor:default}
.d.sel .c{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:none}
.d .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.d.has .dot{background:var(--accent)}
.d.sel .dot{background:var(--accent)}
.d .bk{position:absolute;top:0;right:calc(50% - 26px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:var(--card);font:500 11px/18px var(--f-body);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;color:var(--muted);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend .l1{background:var(--tint)}
.legend .l2{border:1.5px solid var(--accent)}
.legend .l3{position:relative;background:transparent}
.legend .l3::after{content:'';position:absolute;left:-1px;right:-1px;top:50%;border-top:1.5px solid var(--faint)}

.timecol h2{font:700 20px/1.3 var(--f-display);margin:0}
.timecol .dl{margin:2px 0 14px;color:var(--muted);font-size:14px}
.tlist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:681px){.tlist{max-height:560px;overflow-y:auto}}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:44px;padding:0 14px;background:transparent;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.tr:first-child{border-top:0}
.tr .t{font:500 15px var(--f-mono)}
.tr .m{display:flex;align-items:center;justify-content:flex-end;gap:8px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.tr .bar{width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.tr .bar::after{content:'';display:block;height:100%;width:calc(var(--f)*100%);background:var(--accent)}
.tr .chip{width:44px;text-align:center;font-size:12px;font-weight:700;padding:3px 0;border-radius:6px;background:var(--accent);color:var(--on-accent);visibility:hidden}
@media (hover:hover){
  .tr:hover:not(:disabled){background:var(--tint)}
  .tr:hover:not(:disabled) .chip{visibility:visible}
}
.tr.in{background:var(--tint)}
.tr.sel{background:var(--accent);color:var(--on-accent)}
.tr.sel .m{color:var(--on-accent)}
.tr.sel .bar{background:color-mix(in srgb,var(--on-accent) 30%,transparent)}
.tr.sel .bar::after{background:var(--on-accent)}
.tr.sel .chip{visibility:visible;background:var(--on-accent);color:var(--accent)}
.tr:disabled{cursor:default;color:var(--faint)}
.tr:disabled .m{color:var(--faint)}
.tr:disabled .bar::after{background:var(--faint)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.loading{display:flex;align-items:center;gap:10px;padding:18px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.up-day{margin-top:14px}
.up-day:first-of-type{margin-top:6px}
.up-day h3{font-size:14px;font-weight:700;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.up-day h3 .go{font-size:12.5px;font-weight:500;color:var(--accent);background:none;border:0;cursor:pointer;padding:4px 0}
.updated{font-size:12px;color:var(--muted);margin-top:8px}

.section-title{font:700 17px var(--f-display);margin:20px 0 6px}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.person .nm{font-weight:700}
.person .ph{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.person .nt{flex-basis:100%;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.person .sp{margin-left:auto}

.below{margin-top:20px}
.below .panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px 24px}
.below .section-title{margin-top:0}
.lookup{display:flex;gap:8px;flex-wrap:wrap}
.lookup .inp{flex:1;min-width:180px}
.mine-list{display:grid;gap:6px;margin-top:12px}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,11,18,.55);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.scrim[hidden]{display:none}
.sheet{background:var(--card);border-radius:16px;width:min(440px,100%);max-height:100%;overflow:auto;padding:22px;box-shadow:var(--shadow);outline:0}
@media (max-width:680px){
  .scrim{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:18px 18px 0 0;max-height:92%;padding:20px max(18px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
  .btn,.tr,.d .c{transition:background .12s,border-color .12s}
}
form.book{display:grid;gap:14px}
.sh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sh h3{font:700 19px/1.3 var(--f-display);margin:0}
.sh .x{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:18px;line-height:1}
.f{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px;color:var(--ink)}
textarea.inp{min-height:72px;resize:vertical}
.step{display:flex;align-items:center;gap:8px}
.step output{min-width:4.5em;text-align:center;font:500 16px var(--f-mono);color:var(--ink)}
.step .btn{width:46px;padding:0;font-size:18px}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--sun);font-size:13.5px;min-height:1.2em}
.done p{margin:0 0 14px}
.done .ok{font:700 19px var(--f-display);margin-bottom:6px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="theme" role="group" aria-label="화면 모드">
      <button type="button" data-mode="auto" aria-pressed="true">자동</button>
      <button type="button" data-mode="light" aria-pressed="false">라이트</button>
      <button type="button" data-mode="dark" aria-pressed="false">다크</button>
    </div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <main class="card">
    <section class="info" id="info" aria-label="안내"></section>
    <section class="calcol" aria-label="날짜 선택">
      <h2 class="q">날짜를 선택해 주세요.</h2>
      <div class="monthbar">
        <div class="ttl" id="monthTitle"></div>
        <div class="nav">
          <button class="btn small" id="prev" aria-label="이전 달">‹</button>
          <button class="btn small" id="goToday">오늘</button>
          <button class="btn small" id="next" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="cal"></div>
      <div class="legend">
        <span><i class="l1"></i>예약 가능</span>
        <span><i class="l2"></i>오늘</span>
        <span><i class="l3"></i>쉬는 날·만석</span>
      </div>
    </section>
    <section class="timecol" id="timecol" aria-label="시간 선택">
      <h2>시간 선택</h2>
      <p class="dl" id="dateLabel"></p>
      <div id="hours"></div>
      <div id="adminList"></div>
    </section>
  </main>
  <div class="below" id="side"></div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="예약 정보 입력" tabindex="-1"></div>
</div>

<script>
/* ===== 여기만 고치면 돼요 ===== */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbz-F9wglLzsVcoA95LD1kHQwIXqylsnAdaaSS2N9A9iY8QxqS-e9Ig9GzvGdDZajrz5/exec",        // 구글 Apps Script 웹앱 주소. 비워 두면 '체험 모드'(이 브라우저에만 저장)
  NAME: "온화그림미술공간", // 가게 이름
  ADDRESS: "",        // 위치 안내 (예: 대구 중구 ○○로 12, 2층). 비워 두면 표시 안 함
  MESSAGE: "안녕하세요.\n이용할 날짜와 시간을 골라 예약 정보를 남겨 주세요.\n감사합니다.",
  CAPACITY: 5,        // 같은 시간에 이용할 수 있는 최대 인원(명). 1인 1예약이라 예약 5건까지 받아요. API를 연결하면 Code.gs 값이 우선
  OPEN: 10,           // 대여 시작 가능 시각 (시)
  CLOSE: 22,          // 종료 시각 (시)
  STEP: 30,           // 시간 선택 단위 (분)
  MIN_MIN: 120,       // 최소 이용 시간 (분). 처음에도 이 시간이 선택돼요
  MAX_MIN: 240,       // 한 번에 빌릴 수 있는 최대 시간 (분)
  CLOSED_DAYS: []     // 쉬는 요일 (0=일, 1=월 ... 6=토). 예: [1]
};
/* ============================== */

(function(){
const C=CONFIG;
const LOCAL=!C.API_URL;
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const DOW=['일','월','화','수','목','금','토'];
const digits=s=>String(s||'').replace(/\D/g,'');
const hh=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const durText=m=>{const a=Math.floor(m/60),b=m%60;return (a?a+'시간':'')+(a&&b?' ':'')+(b?b+'분':'');};
const span=(s,n)=>hh(s)+'–'+hh(s+n);
const slots=()=>{const a=[];for(let m=C.OPEN*60;m<C.CLOSE*60;m+=C.STEP)a.push(m);return a;};
const today=new Date(); today.setHours(0,0,0,0);
const todayStr=ymd(today);
const label=d=>{const x=parse(d);return (x.getMonth()+1)+'월 '+x.getDate()+'일 ('+DOW[x.getDay()]+')';};

function h(tag,attrs){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(let i=2;i<arguments.length;i++){
    [].concat(arguments[i]).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  }
  return e;
}
const ICON={
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18.5 14.8c1.6.8 2.5 2.4 2.5 5.2"/></svg>',
  pin:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  door:'<svg viewBox="0 0 24 24"><path d="M5 21V4h10v17M3 21h18"/><circle cx="12" cy="12.500" r=".8"/></svg>'
};
function li(icon,text){ const l=h('li'); const s=h('span'); s.innerHTML=icon; l.append(s.firstChild,h('span',{text})); return l; }

/* ---------- 저장소: API(구글 시트) 또는 체험 모드(localStorage) ---------- */
const LS='hwasil.rental.v1';
const lsLoad=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return [];}};
const lsSave=a=>{try{localStorage.setItem(LS,JSON.stringify(a));}catch(e){}};
function occOf(list){
  const occ={};
  list.forEach(b=>{ for(let m=b.start;m<b.start+b.dur;m+=C.STEP){ (occ[b.date]=occ[b.date]||{})[m]=((occ[b.date]||{})[m]||0)+1; } });
  return occ;
}
async function post(payload){
  const r=await fetch(C.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  return r.json();
}
const A={
  async pub(){
    if(LOCAL) return {ok:true,occ:occOf(lsLoad())};
    return post({action:'public',from:todayStr});
  },
  async book(item){
    if(LOCAL){
      const list=lsLoad(), occ=occOf(list);
      if(list.some(b=>b.date===item.date&&digits(b.phone)===digits(item.phone)&&b.start<item.start+item.dur&&item.start<b.start+b.dur))
        return {ok:false,error:'같은 연락처로 겹치는 시간에 이미 예약이 있어요. "내 예약 확인"에서 확인해 주세요.'};
      for(let m=item.start;m<item.start+item.dur;m+=C.STEP){ if(((occ[item.date]||{})[m]||0)+1>C.CAPACITY) return {ok:false,error:'방금 다른 예약이 들어와서 자리가 부족해요.'}; }
      list.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:new Date().toISOString()},item));
      lsSave(list); return {ok:true};
    }
    return post({action:'book',item});
  },
  async mine(phone){
    if(LOCAL) return {ok:true,items:lsLoad().filter(b=>digits(b.phone)===digits(phone)&&b.date>=todayStr)};
    return post({action:'mine',phone,from:todayStr});
  },
  async cancelMine(id,phone){
    if(LOCAL){ lsSave(lsLoad().filter(b=>!(b.id===id&&digits(b.phone)===digits(phone)))); return {ok:true}; }
    return post({action:'cancelMine',id,phone});
  },
  async adminList(key){
    if(LOCAL) return {ok:true,items:lsLoad().filter(b=>b.date>=todayStr)};
    return post({action:'adminList',key,from:todayStr});
  },
  async adminCancel(id,key){
    if(LOCAL){ lsSave(lsLoad().filter(b=>b.id!==id)); return {ok:true}; }
    return post({action:'adminCancel',id,key});
  }
};

/* ---------- 상태 ---------- */
const S={loaded:false,lastLoad:0,view:new Date(today.getFullYear(),today.getMonth(),1),sel:todayStr,occ:{},start:null,dur:120,
  admin:false,key:'',items:[],mine:null,mineErr:'',done:null,busy:false,confirm:null,netErr:false,loginOpen:false,loginErr:'',
  };
const cnt=(d,m)=>((S.occ[d]||{})[m])||0;
const rem=(d,m)=>Math.max(0,C.CAPACITY-cnt(d,m));
const isClosed=d=>C.CLOSED_DAYS.indexOf(parse(d).getDay())>=0;
function passed(d,m){
  if(d<todayStr) return true;
  if(d>todayStr) return false;
  const n=new Date(); return m<=n.getHours()*60+n.getMinutes();
}
/* start 부터 이어서 비어 있는 시간(분), 최대 MAX_MIN */
function maxDur(d,start){
  let t=0;
  for(let m=start;m<C.CLOSE*60&&t<C.MAX_MIN&&rem(d,m)>0;m+=C.STEP) t+=C.STEP;
  return t;
}
/* 시작할 수 있는 칸: 지나지 않았고, 최소 이용 시간만큼 이어서 비어 있어야 해요 */
const startable=(d,m)=>!passed(d,m)&&maxDur(d,m)>=C.MIN_MIN;
function dayFull(d){ return !slots().some(m=>startable(d,m)); }
function dayHasBooking(d){ return slots().some(m=>cnt(d,m)>0); }

/* ---------- 화면 ---------- */

    box.append(h('form',{class:'login',onsubmit:async e=>{e.preventDefault();await login(k.value);}},k,h('button',{class:'btn small primary',type:'submit'},'확인'),h('button',{class:'btn small',type:'button',onclick:()=>{S.loginOpen=false;S.loginErr='';renderInfo();}},'닫기')));

function renderNotice(){

function renderCal(){
  const v=S.view;
  $('#monthTitle').textContent=v.getFullYear()+'년 '+(v.getMonth()+1)+'월';
  const dows=$('#dows'); if(!dows.children.length) DOW.forEach(d=>dows.append(h('div',{class:'dow',text:d})));
  const cal=$('#cal'); cal.replaceChildren();
  const first=new Date(v.getFullYear(),v.getMonth(),1).getDay();
  const days=new Date(v.getFullYear(),v.getMonth()+1,0).getDate();
  for(let i=0;i<first;i++) cal.append(h('div',{class:'d blank','aria-hidden':'true'}));
  for(let d=1;d<=days;d++){
    const dt=new Date(v.getFullYear(),v.getMonth(),d), s=ymd(dt);
    const closed=isClosed(s), past=s<todayStr, full=!closed&&!past&&dayFull(s);
    const avail=!closed&&!past&&!full;
    const nBook=S.admin?S.items.filter(b=>b.date===s).length:0;
    const cls=['d',avail&&'avail',closed&&'closed',past&&'past',full&&'full',dt.getDay()===0&&'sun',s===todayStr&&'today',s===S.sel&&'sel',(!closed&&dayHasBooking(s))&&'has'].filter(Boolean).join(' ');
    cal.append(h('button',{class:cls,
      'aria-label':label(s)+(closed?' 쉬는 날':'')+(full?' 만석':'')+(nBook?' 예약 '+nBook+'건':''),
      'aria-pressed':s===S.sel?'true':null,
      onclick:()=>selectDate(s)},
      h('span',{class:'c',text:String(d)}),
      h('i',{class:'dot'}),
      nBook?h('span',{class:'bk',text:String(nBook)}):null));
  }
}
function selectDate(s){
  S.sel=s;S.start=null;S.done=null;S.confirm=null;
  renderCal(); renderHours(); renderForm();
  if(window.matchMedia('(max-width:680px)').matches){
    const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    $('#timecol').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  }
}
function renderHours(){
  const s=S.sel, x=parse(s);
  $('#dateLabel').textContent=(x.getMonth()+1)+'월 '+x.getDate()+'일 '+DOW[x.getDay()]+'요일 · 시작 시간을 골라 주세요';
  const box=$('#hours'); box.replaceChildren();
  const adm=$('#adminList'); adm.replaceChildren();
  if(isClosed(s)){ box.append(h('div',{class:'empty',text:'이 요일은 쉬는 날이에요.'})); return; }
  if(!S.loaded){
    if(S.netErr) box.append(h('div',{class:'loading'},'예약 현황을 불러오지 못했어요.',h('button',{class:'btn small',type:'button',onclick:async()=>{S.netErr=false;renderHours();await refresh();renderAll();}},'다시 시도')));
    else box.append(h('div',{class:'loading',role:'status'},h('span',{class:'spin','aria-hidden':'true'}),'예약 현황을 불러오는 중이에요…'));
    return;
  }
  const list=h('div',{class:'tlist'});
  slots().forEach(m=>{
    const c=cnt(s,m), left=rem(s,m), past=passed(s,m);
    const sel=S.start===m, inRange=S.start!=null&&m>=S.start&&m<S.start+S.dur&&!sel;
    const bar=h('span',{class:'bar'}); bar.style.setProperty('--f',Math.min(1,c/C.CAPACITY));
    const short=!past&&left>0&&maxDur(s,m)<C.MIN_MIN;
    const off=past||left===0||short;
    const stat=past?'지남':(left===0?'만석':(short?durText(C.MIN_MIN)+' 미만':c+' / '+C.CAPACITY+'명'));
    list.append(h('button',{class:['tr',sel&&'sel',inRange&&'in'].filter(Boolean).join(' '),type:'button',disabled:off,
      'aria-label':hh(m)+' '+stat,
      onclick:()=>{S.start=m;S.dur=Math.min(C.MIN_MIN,maxDur(s,m));S.done=null;renderHours();renderForm();}},
      h('span',{class:'t',text:hh(m)}),
      h('span',{class:'m'},bar,h('span',{text:stat})),
      h('span',{class:'chip',text:'선택'})));
  });
  box.append(list);
  if(S.admin){
    const items=S.items.filter(b=>b.date===s).sort((a,b)=>a.start-b.start);
    adm.append(h('h3',{class:'section-title',text:'이 날 예약자'}));
    if(!items.length) adm.append(h('div',{class:'empty',text:'예약이 없어요.'}));
    const wrap=h('div',{class:'people'});
    items.forEach(b=>{
      const confirming=S.confirm===b.id;
      wrap.append(h('div',{class:'person'},
        h('span',{class:'ph',text:span(b.start,b.dur)}),
        h('span',{class:'nm',text:b.name}),
        h('span',{class:'ph',text:b.phone}),
        b.car?h('span',{class:'ph',text:'차량 '+b.car}):null,
        h('button',{class:'btn small danger sp',onclick:()=>adminCancel(b)},confirming?'한 번 더 누르면 취소':'예약 취소')));
    });
    adm.append(wrap);
  }
}
function closeSheet(){ S.start=null; S.done=null; renderHours(); renderForm(); }
function renderForm(){
  const scrim=$('#scrim'), sheet=$('#sheet'); sheet.replaceChildren();
  if(S.done){
    scrim.hidden=false; document.body.style.overflow='hidden';
    sheet.append(h('div',{class:'done',role:'status'},
      h('div',{class:'ok',text:'예약이 접수됐어요'}),

      h('button',{class:'btn primary',type:'button',onclick:()=>{S.done=null;renderForm();}},'확인')));

  }
  if(S.start==null){ scrim.hidden=true; document.body.style.overflow=''; return; }
  scrim.hidden=false; document.body.style.overflow='hidden';
  const s=S.sel;
  const name=h('input',{class:'inp',id:'f-name',autocomplete:'off',maxlength:'30'});
  const phone=h('input',{class:'inp',id:'f-phone',type:'tel',inputmode:'tel',autocomplete:'off',maxlength:'20',placeholder:'010-0000-0000'});
  const car=h('input',{class:'inp',id:'f-car',autocomplete:'off',maxlength:'20',placeholder:'예: 12가 3456'});
  const dv=h('output');
  const fb=h('div',{class:'hint'}), err=h('div',{class:'err',role:'alert'});
  const submit=h('button',{class:'btn primary',type:'submit'},'예약하기');
  const title=h('h3');
  function upd(){
    const mx=maxDur(s,S.start);
    S.dur=Math.max(C.MIN_MIN,Math.min(S.dur,Math.max(mx,C.MIN_MIN)));
    title.textContent=label(s)+' '+span(S.start,S.dur);
    dv.textContent=durText(S.dur);
    fb.textContent=mx>=C.MIN_MIN?durText(C.MIN_MIN)+'부터 최대 '+durText(mx)+'까지 이용할 수 있어요.':'이 시작 시간은 예약할 수 없어요.';
    submit.disabled=mx<C.MIN_MIN||S.busy;
    minus.disabled=S.dur<=C.MIN_MIN; plus.disabled=S.dur>=mx;
    renderHours();
  }
  const minus=h('button',{class:'btn',type:'button','aria-label':'이용 시간 줄이기',onclick:()=>{S.dur=Math.max(C.MIN_MIN,S.dur-C.STEP);upd();}},'−');
  const plus=h('button',{class:'btn',type:'button','aria-label':'이용 시간 늘리기',onclick:()=>{S.dur=Math.min(Math.max(maxDur(s,S.start),C.MIN_MIN),S.dur+C.STEP);upd();}},'+');
  const form=h('form',{class:'book',novalidate:true,onsubmit:async e=>{
    e.preventDefault(); if(S.busy) return;
    const nm=name.value.trim(), ph=phone.value.trim();

    if(digits(ph).length<9){err.textContent='연락처를 숫자 9자리 이상으로 입력해 주세요.';phone.focus();return;}
    const cr=car.value.trim();
    if(!cr){err.textContent='차량번호를 입력해 주세요. 차량이 없으면 "없음"이라고 적어 주세요.';car.focus();return;}
    if(S.dur>maxDur(s,S.start)){err.textContent='선택한 시간에 자리가 부족해요.';return;}
    S.busy=true; submit.disabled=true; err.textContent='';
    const item={date:s,start:S.start,dur:S.dur,name:nm,phone:ph,car:cr};
    try{
      const r=await A.book(item);
      if(!r.ok){ err.textContent=r.error||'예약하지 못했어요.'; await refresh(); S.busy=false; renderAll(); upd(); return; }
      S.done=label(s)+' '+span(item.start,item.dur)+'. 변경이나 취소는 화면 아래 "내 예약 확인"에서 할 수 있어요.';
      S.start=null; S.busy=false;
      await refresh(); renderAll(); renderForm();

  }},
    h('div',{class:'sh'},title,h('button',{class:'x',type:'button','aria-label':'닫기',onclick:closeSheet},'×')),
    h('div',{class:'f'},'이용 시간',
      h('div',{class:'step'},
        minus,
        dv,
        plus),
      fb),
    h('label',{class:'f','for':'f-name'},'이름',name),
    h('label',{class:'f','for':'f-phone'},'연락처',phone),
    h('label',{class:'f','for':'f-car'},'차량번호',car),
    err,
    submit);
  sheet.append(form);

}

/* ---------- 동작 ---------- */
async function refresh(){
  try{
    const r=await A.pub();
    if(r.ok){
      S.occ=r.occ||{}; S.netErr=false; S.loaded=true; S.lastLoad=Date.now();
      if(r.config){ ['CAPACITY','OPEN','CLOSE','STEP','MIN_MIN','MAX_MIN','CLOSED_DAYS','NAME','ADDRESS','MESSAGE'].forEach(k=>{ if(r.config[k]!=null) C[k]=r.config[k]; }); }
    }
    else S.netErr=true;
    if(S.admin){ const a=await A.adminList(S.key); if(a.ok){ S.items=a.items; S.occ=occOf(a.items); } }
  }catch(e){ S.netErr=true; }
}
async function login(key){
  try{
    const r=await A.adminList(key);
    if(!r.ok){ S.loginErr='비밀번호가 맞지 않아요.'; renderInfo(); return; }
    S.admin=true; S.key=key; S.items=r.items; S.loginOpen=false; S.loginErr='';
    try{ sessionStorage.setItem('hwasil.key',key); }catch(e){}
    await refresh(); renderAll(); renderForm();
  }catch(e){ S.loginErr='서버에 연결하지 못했어요.'; renderInfo(); }
}
function logout(){ S.admin=false; S.key=''; S.items=[]; try{ sessionStorage.removeItem('hwasil.key'); }catch(e){} refresh().then(()=>{renderAll();renderForm();}); }
async function adminCancel(b){
  if(S.confirm!==b.id){ S.confirm=b.id; renderHours(); setTimeout(()=>{ if(S.confirm===b.id){S.confirm=null;renderHours();} },4000); return; }
  try{ const r=await A.adminCancel(b.id,S.key); if(r.ok){ S.confirm=null; await refresh(); renderAll(); } }
  catch(e){ S.netErr=true; renderNotice(); }
}

$('#prev').addEventListener('click',()=>{const v=S.view;S.view=new Date(v.getFullYear(),v.getMonth()-1,1);renderCal();});
$('#next').addEventListener('click',()=>{const v=S.view;S.view=new Date(v.getFullYear(),v.getMonth()+1,1);renderCal();});
$('#goToday').addEventListener('click',()=>{S.view=new Date(today.getFullYear(),today.getMonth(),1);S.sel=todayStr;S.start=null;renderAll();renderForm();});
$('#scrim').addEventListener('click',e=>{ if(e.target===$('#scrim')){ if(S.done){S.done=null;renderForm();} else closeSheet(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#scrim').hidden){ if(S.done){S.done=null;renderForm();} else closeSheet(); } });

/* 화면으로 돌아왔을 때와 열어 둔 동안 2분마다 현황을 새로 불러와요 */
let refreshing=false;
async function autoRefresh(force){
  if(refreshing||document.hidden) return;
  if(ymd(new Date())!==todayStr){ location.reload(); return; }   // 날짜가 바뀌었으면 새로고침
  if(!force&&Date.now()-S.lastLoad<30000) return;
  refreshing=true;
  try{ await refresh(); renderNotice(); renderCal(); renderHours(); if(S.admin) renderSide(); }finally{ refreshing=false; }
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) autoRefresh(false); });
window.addEventListener('focus',()=>autoRefresh(false));
setInterval(()=>autoRefresh(true),120000);

renderAll();
(async()=>{
  let k=''; try{ k=sessionStorage.getItem('hwasil.key')||''; }catch(e){}
  if(k && !LOCAL){ try{ const r=await A.adminList(k); if(r.ok){ S.admin=true; S.key=k; S.items=r.items; } }catch(e){} }
  await refresh(); renderAll();
  window.__hwasil={S,A};
})();
})();
</script>
